<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fundo Roxo Profundo -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1D133B" />
      <stop offset="100%" stop-color="#090514" />
    </radialGradient>

    <!-- Sombra Projetada do Bloco 3D -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="2" stdDeviation="12" flood-color="#FF0080" flood-opacity="0.25"/>
    </filter>

    <!-- Brilho Neon (Apenas para elementos de fundo/energia) -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradiente do Bloco (Ciano -> Azul Profundo) -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#0077FF" />
      <stop offset="100%" stop-color="#002699" />
    </linearGradient>

    <!-- Borda Chanfrada (Bevel 3D) -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#001140" stop-opacity="0.6" />
    </linearGradient>

    <!-- Gradiente de Energia Harmonizado (Magenta -> Dourado) -->
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0080" />
      <stop offset="60%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#FFC800" />
    </linearGradient>
    <!-- O glifo, definido UMA vez e reusado pelas três camadas (aura, entalhe
         e forma branca). Antes o mesmo path aparecia copiado três vezes, e foi
         assim que um defeito de anatomia passou: corrigir o dígito exigia
         editar três lugares idênticos, e bastava esquecer um para as camadas
         desalinharem. Com <use>, a forma tem uma fonte só.

         Bowl e haste são dois <path> irmãos de propósito: fundidos num único
         path com fill-rule="evenodd", a área em que a haste encosta na barriga
         viraria buraco.

         Geometria: bowl r=56 centrado em (256,216) com contra-forma r=23, e
         haste reta de 40 de largura descendo pela BORDA DIREITA do bowl
         (x 272..312) até y=352. A caixa do glifo fica em x 200..312,
         y 160..352 — centro (256,256), praticamente o centro do bloco (251).
         A barriga ocupa 58% da altura total, que é proporção de dígito. -->
    <g id="nine">
      <path fill-rule="evenodd"
            d="M 256 160 a 56 56 0 1 0 0.1 0 Z
               M 256 193 a 23 23 0 1 0 0.1 0 Z" />
      <path d="M 272 216
               L 312 216
               L 312 344
               A 8 8 0 0 1 304 352
               L 280 352
               A 8 8 0 0 1 272 344
               Z" />
    </g>
  </defs>

  <!-- Fundo -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Tudo menos o fundo vive dentro de #mark, e não é organização: é o que
       permite `rsvg-convert -i mark` (export-id) renderizar a marca SOZINHA, com
       transparência em volta, a partir deste mesmo arquivo. O foreground do
       ícone adaptativo do Android precisa disso — encolher o logo inteiro,
       com o retângulo de fundo escuro junto, é o que produz a marca minúscula
       numa ilha preta dentro da máscara. Uma fonte da verdade, dois recortes. -->
  <g id="mark">

  <!-- Anel de Energia (Fuse Arc) -->
  <path d="M 125 385 A 180 180 0 1 1 420 256" 
        fill="none" 
        stroke="url(#energyGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        filter="url(#glow)"
        opacity="0.85" />

  <!-- Partículas Energéticas -->
  <circle cx="420" cy="256" r="9" fill="#FFC800" filter="url(#glow)" />
  <circle cx="125" cy="385" r="7" fill="#FF0080" filter="url(#glow)" />

  <!-- Sombra de Profundidade do Bloco Central -->
  <rect x="116" y="131" width="280" height="270" rx="60" fill="#000000" opacity="0.35" />

  <!-- Base 3D do Bloco -->
  <rect x="116" y="126" width="280" height="270" rx="60" fill="#001866" filter="url(#tileShadow)" />

  <!-- Bloco Frontal (Centro Y=251/256) -->
  <rect x="116" y="116" width="280" height="270" rx="58" fill="url(#tileGrad)" />

  <!-- Borda Chanfrada Interna -->
  <rect x="118" y="118" width="276" height="266" rx="56" 
        fill="none" 
        stroke="url(#bevelGrad)" 
        stroke-width="3.5" />

  <!-- Reflexo de Vidro Curvo (Top Cap) -->
  <path d="M 120 170 Q 256 205 392 170 L 392 166 A 56 56 0 0 0 336 118 L 176 118 A 56 56 0 0 0 120 166 Z" 
        fill="#FFFFFF" 
        opacity="0.22" />

  <!-- O número 9, em três camadas sobre a mesma forma (ver <g id="nine">).
       A ordem importa: aura embaixo, entalhe no meio, forma branca por cima
       e SEM desfoque — é ela que o olho usa para ler o dígito, e borrá-la
       devolveria a ambiguidade que a correção de anatomia veio eliminar. -->

  <!-- 1. Aura ciano, que descola o dígito do azul do bloco -->
  <use href="#nine" fill="#00F0FF" filter="url(#glow)" opacity="0.6" />

  <!-- 2. Entalhe: a mesma forma deslocada 4 para baixo, dando espessura -->
  <use href="#nine" fill="#001040" opacity="0.65" transform="translate(0, 4)" />

  <!-- 3. Glifo em branco puro, nítido -->
  <use href="#nine" fill="#FFFFFF" />

  </g>
</svg>

# Configuração da splash nativa (cold start). Vence sobre qualquer bloco
# equivalente no pubspec.yaml, pela mesma razão do flutter_launcher_icons.yaml:
# arquivo próprio do pacote, uma fonte da verdade só.
#
# Regerar depois de trocar a arte:
#   dart run flutter_native_splash:create
#
# **Mudança de fonte (2026-09-10):** `assets/images/logo_splash.png` deixou de
# ser gerado por `tool/prepare_icons.dart` a partir de `logo.svg` — é agora
# uma cópia direta do mestre novo do ícone (`assets/icon/app_icon.png`, o
# brasão dourado com o "9"), o mesmo usado no `flutter_launcher_icons.yaml`.
#
# **Sem recorte de fundo, e é decisão explícita.** O mestre novo não tem uma
# versão com fundo transparente (só o quadrado inteiro com o azul-marinho já
# embutido) nem uma camada separada para extrair uma — ao contrário do selo
# antigo, que vinha de um grupo isolável do SVG. A splash mostra o quadrado
# inteiro, cantos retos, sentado sobre a cor de fundo do app — funcional, mas
# sem o acabamento flutuante/arredondado que o design anterior tinha. Se uma
# versão recortada (fundo transparente) for produzida depois, é só trocar o
# `image:` abaixo e regerar.
#
# `android_12:` usa o MESMO arquivo do bloco legado agora, pelo mesmo motivo:
# não existe uma versão já recortada pela zona segura de 66% do ícone
# adaptativo (o `app_icon_foreground.png` antigo ficou para trás com o design
# anterior — ver `flutter_launcher_icons.yaml`). Usar o quadrado inteiro na
# máscara circular do Android 12+ pode cortar os cantos do brasão; é o mesmo
# tipo de perda já aceito no ícone adaptativo, não uma regressão nova.
#
# A cor continua sendo AppColors.darkBackground (0xFF121212, ver
# lib/core/constants/app_colors.dart) — o scaffoldBackgroundColor real do
# app —, não a cor de fundo do próprio mestre (#06091F): a splash precisa
# casar com o primeiro frame de verdade (LevelSelectScreen), não com a
# paleta do asset.
flutter_native_splash:
  color: "#121212"
  image: assets/images/logo_splash.png

  android_12:
    color: "#121212"
    image: assets/images/logo_splash.png

  android: true
  ios: true
  web: false

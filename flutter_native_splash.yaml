# Configuração da splash nativa (cold start). Vence sobre qualquer bloco
# equivalente no pubspec.yaml, pela mesma razão do flutter_launcher_icons.yaml:
# arquivo próprio do pacote, uma fonte da verdade só.
#
# Regerar depois de qualquer mudança aqui ou em assets/images/logo.png:
#   dart run flutter_native_splash:create
#
# assets/images/logo_splash.png é derivado de logo.svg (a versão corrigida,
# fundo quase-uniforme #00041a), com o fundo removido por flood-fill de cor a
# partir dos quatro cantos + pena de 4px na borda — não é o logo.png/logo.svg
# usados no resto do app, que têm fundo opaco embutido e não servem para
# compor sobre uma cor de tela sólida sem deixar um retângulo visível. Gerar de
# novo exige refazer esse recorte a partir do render fonte, não é um passo
# automático do prepare_icons.dart.
#
# A cor É AppColors.darkBackground (0xFF121212, ver
# lib/core/constants/app_colors.dart) — o scaffoldBackgroundColor real do
# app —, não uma cor tirada do próprio render: com o fundo do logo removido, a
# splash deve casar com o primeiro frame de verdade (LevelSelectScreen), não
# com a paleta do asset.
flutter_native_splash:
  color: "#121212"
  image: assets/images/logo_splash.png

  android_12:
    color: "#121212"
    image: assets/images/logo_splash.png

  android: true
  ios: true
  web: false

# Configuração da splash nativa (cold start). Vence sobre qualquer bloco
# equivalente no pubspec.yaml, pela mesma razão do flutter_launcher_icons.yaml:
# arquivo próprio do pacote, uma fonte da verdade só.
#
# Regerar depois de qualquer mudança em assets/images/logo.svg:
#   dart run tool/prepare_icons.dart
#   dart run flutter_native_splash:create
#
# assets/images/logo_splash.png agora É gerado automaticamente por
# tool/prepare_icons.dart, junto dos outros mestres — é o mesmo selo com fundo
# transparente que alimenta a frente do ícone adaptativo (recorte do grupo
# `<g id="mark">` de logo.svg), só que sem o encolhimento de zona segura
# (`_insetForAdaptive`), que existe só por causa da máscara circular do ícone
# e não se aplica à splash. Não é mais um recorte manual por flood-fill.
#
# A cor É AppColors.darkBackground (0xFF121212, ver
# lib/core/constants/app_colors.dart) — o scaffoldBackgroundColor real do
# app —, não uma cor tirada do próprio render: com o fundo do logo removido, a
# splash deve casar com o primeiro frame de verdade (LevelSelectScreen), não
# com a paleta do asset.
flutter_native_splash:
  color: "#121212"
  image: assets/images/logo_splash.png

  android_12:
    color: "#121212"
    image: assets/images/logo_splash.png

  android: true
  ios: true
  web: false

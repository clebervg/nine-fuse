# Configuração da splash nativa (cold start). Vence sobre qualquer bloco
# equivalente no pubspec.yaml, pela mesma razão do flutter_launcher_icons.yaml:
# arquivo próprio do pacote, uma fonte da verdade só.
#
# Regerar depois de trocar a arte:
#   dart run flutter_native_splash:create
#
# **Mudança de fonte (2026-10-01), pacote de arte "candy pop":** a cor passou
# de `#121212` (fundo do menu) para `#080D2A`, o fundo da arte. A splash
# nativa agora é seguida pela tela de carregamento do Flutter
# (`SplashScreen`), que é a imagem cheia do pacote sobre esse mesmo
# azul-marinho — casar a nativa com ela é o que evita um piscar de cor entre
# as duas. A troca para `#121212` acontece depois, na navegação para o menu.
#
# **iOS e Android legado só com cor, sem imagem.** A Apple desencoraja
# imagem grande na LaunchScreen, e a arte de verdade aparece um instante
# depois, na tela de carregamento. Repetir o logo na nativa faria ele
# "pular" de tamanho e posição na transição.
#
# **Android 12+ com `splash_icon.png`** (insígnia do 9, 1152 px = 288 dp em
# xxxhdpi, já dentro da zona circular): o sistema sempre desenha um ícone
# nessa splash — sem `image`, ele usaria o ícone do launcher.
#
# O `assets/images/logo_splash.png` antigo (o brasão de 2026-09-10) saiu.
flutter_native_splash:
  color: "#080D2A"

  android_12:
    color: "#080D2A"
    image: assets/icon/splash_icon.png

  android: true
  ios: true
  web: false

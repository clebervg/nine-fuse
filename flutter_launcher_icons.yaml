# Ícones nativos de todas as plataformas, gerados a partir dos mestres em
# assets/icon/.
#
#   dart run flutter_launcher_icons       # mestres -> todos os tamanhos
#
# **Mudança de fonte (2026-10-01):** os mestres vêm do pacote de arte "candy
# pop" (insígnia dodecagonal roxa com o "9" dourado, a mesma do `tile_9`):
#   - `app_icon.png`            1024, quadro inteiro (iOS, web, Android legado)
#   - `app_icon_foreground.png` 432, frente do ícone adaptativo, já recortada
#                               na zona segura e com fundo transparente
#   - `app_icon_background.png` 432, fundo do ícone adaptativo (céu estrelado)
# O pacote entregou a frente separada, então o Android voltou a ter ícone
# adaptativo — a limitação registrada na troca de 2026-09-10 (sem camada de
# frente, faíscas decepadas pela máscara circular) deixou de existir.
#
# Os PNGs prontos por densidade que vieram no pacote (`mipmap-*`) não são
# copiados à mão: esta ferramenta é a fonte única, e uma cópia manual seria
# sobrescrita na próxima regeração.
#
# Sem camada `monochrome` (ícone temático do Android 13+): o pacote sugeria
# a própria frente colorida, que vira uma silhueta chapada sob o tema. Fica
# de fora até existir uma versão monocromática de verdade.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  ios: true
  # O 1024 do pacote vem com canal alfa (RGBA) e a App Store recusa ícone
  # com alfa: a ferramenta achata sobre `background_color_ios`.
  remove_alpha_ios: true
  # Fundo da splash e da arte (`#080D2A`, `splash.background` no manifest).
  background_color_ios: "#080D2A"

  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  # A frente do pacote já vem posicionada na zona segura de 66%. O inset
  # padrão da ferramenta (16%) a encolheria de novo — o mesmo "encolhimento
  # duplo" que já deixou a marca minúscula dentro da máscara uma vez.
  adaptive_icon_foreground_inset: 0

  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#080D2A"
    theme_color: "#080D2A"

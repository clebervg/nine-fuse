# Ícones nativos de todas as plataformas, gerados a partir dos mestres.
#
#   dart run tool/prepare_icons.dart      # SVG -> mestres (chama o rsvg-convert)
#   dart run flutter_launcher_icons       # mestres -> todos os tamanhos
#
# Os mestres em assets/icon/ (e o próprio assets/images/logo.png) são derivados
# de assets/images/logo.svg, a fonte da verdade, e não devem ser editados à mão
# — regere-os com a ferramenta acima.
#
# A cor de fundo é o stop externo do gradiente do SVG. Ela precisa acompanhar
# qualquer mudança nesse stop: é ela que preenche o que a arte não cobre, e uma
# divergência aparece como um halo quadrado atrás do ícone.
flutter_launcher_icons:
  # Quadrado opaco. O logo original tem cantos transparentes, o que a App Store
  # rejeita; o arredondamento é aplicado por cada sistema.
  image_path: "assets/icon/app_icon.png"

  ios: true
  # Redundante com o mestre já achatado, mas mantido como rede de segurança:
  # se alguém trocar o `image_path` por um PNG com alfa, o envio continua
  # válido em vez de ser recusado na revisão.
  remove_alpha_ios: true
  background_color_ios: "#000028"

  android: "ic_launcher"
  min_sdk_android: 21

  # Android 8+ recorta a frente em círculo, quadrado ou outras máscaras
  # conforme o aparelho. `app_icon_foreground.png` é editado à mão (não vem do
  # `prepare_icons.dart`): o logo é um PNG raster sem canal alfa embutido no
  # SVG, então o `<g id="mark">` que a ferramenta espera para separar arte de
  # fundo não existe, e o fallback dela usa o quadrado opaco inteiro como
  # conteúdo — a zona segura de 66% então encolhe pelo raio até o canto do
  # quadrado (~47% de preenchimento), pequeno demais para ler no launcher.
  # A frente atual preenche ~90% do canvas, cortando minimamente os quatro
  # cantos do vidro só em máscaras circulares (a maioria dos launchers atuais
  # usa squircle/quadrado arredondado, onde não há corte). Preferir "ler bem
  # na maioria dos aparelhos" a "nunca cortar 2px num aparelho raro".
  adaptive_icon_background: "#000028"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#000028"
    theme_color: "#000028"

# Ícones nativos de todas as plataformas, gerados a partir do mestre em
# assets/icon/app_icon.png.
#
#   dart run flutter_launcher_icons       # mestre -> todos os tamanhos
#
# **Mudança de fonte (2026-09-10):** o mestre passou a ser um PNG 1024x1024
# entregue pronto (o brasão dourado com o "9"), e não mais derivado de
# `assets/images/logo.svg` via `tool/prepare_icons.dart`. Os dois artefatos
# antigos daquele pipeline (`app_icon_old.png`, `app_icon_foreground.png`)
# ficaram para trás em `assets/icon/` como referência — não apague sem
# confirmar que ninguém vai precisar recompor o pipeline do SVG.
#
# **Sem ícone adaptativo (Android) desta vez, e é decisão explícita.** O
# mestre novo não veio com uma camada de frente separada (fundo transparente,
# arte recortada na zona segura de 66%) nem com o SVG de origem para a
# ferramenta extrair uma — as faíscas do brasão encostam perto da borda, e
# usar o quadro inteiro como `adaptive_icon_foreground` cortaria pontas em
# aparelhos que aplicam máscara circular. Até uma frente de verdade ser
# produzida, o Android usa o mestre como ícone único (legado, sem recorte
# adaptativo) — pior do que o ícone adaptativo, melhor do que uma faísca
# decepada.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  ios: true
  # O mestre já é opaco (sem canal alfa em uso), mas mantido como rede de
  # segurança: se um mestre futuro vier com transparência, o envio continua
  # válido em vez de ser recusado na revisão.
  remove_alpha_ios: true
  # Amostrado do canto do próprio mestre novo (`#06091F`), não mais do stop
  # do gradiente do SVG antigo — é o que preenche atrás do ícone quando o
  # sistema aplica a máscara arredondada do iOS.
  background_color_ios: "#06091F"

  android: "ic_launcher"
  min_sdk_android: 21

  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#06091F"
    theme_color: "#06091F"
